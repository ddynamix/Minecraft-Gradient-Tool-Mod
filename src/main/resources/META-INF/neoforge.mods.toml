modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/ddynamix/Minecraft-Gradient-Tool-Mod/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Tyler (ddynamix)"
description = '''
A mod that adds gradient wands to Minecraft.
'''
logoFile = "assets/gradient_wand/icon.png"

# NeoForge takes Maven ranges, not the comparator syntax fabric.mod.json uses, so these are
# written literally rather than expanded from mod.mc_compat.
[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.1]"
ordering = "NONE"
side = "BOTH"
