# Central properties for every version node.
# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties

mod.id = "gradient_wand"
mod.name = "Gradient Wand"
mod.group = "net.tyler.gradientwand"
mod.version = "1.0.0"

deps.fabric_loader = "0.19.5"

# Resolves to net.fabricmc:fabric-loom:1.17.20, the same pin MidnightLib uses from 1.20.1 to 26.3
loomx.loom_version = "1.17-SNAPSHOT"

["1.20.1"]
# Range written into fabric.mod.json's depends block
mod.mc_compat = "~1.20.1"
# Releases to mark compatible on Modrinth and CurseForge
mod.mc_releases = ["1.20.1"]

deps.yarn_mappings = "1.20.1+build.10"
deps.fabric_api = "0.92.12+1.20.1"

["1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
mod.mc_releases = ["1.21", "1.21.1"]

deps.yarn_mappings = "1.21.1+build.3"
deps.fabric_api = "0.116.17+1.21.1"
